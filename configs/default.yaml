# Paths are relative to the project directory. Run commands from there.
data:
  root: data/MAMI
  train: train.tsv
  validation: validation.tsv
  test: test.tsv
  missing_images: skip  # switch to error when using the full dataset
model:
  id: Qwen/Qwen2.5-VL-3B-Instruct
  revision: main  # download resolves this to a commit recorded in model_info.json
  local_dir: models/qwen2.5-vl-3b
  device: auto  # auto chooses mps on Mac, cuda on NVIDIA, otherwise cpu
  min_pixels: 50176
  max_pixels: 401408
  max_new_tokens: 16
experiment:
  seed: 42
  output: outputs
training:
  epochs: 1
  learning_rate: 0.0001
  accumulation_steps: 8
  rank: 8
  alpha: 16
