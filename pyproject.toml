[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mami-research"
version = "0.1.0"
description = "Simple MAMI baseline, Qwen VLM inference and LoRA experiments"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2", "Pillow>=10,<12", "PyYAML>=6,<7"]

[project.optional-dependencies]
vlm = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers==4.57.1", "accelerate>=1.2,<2", "huggingface-hub>=0.34,<1", "qwen-vl-utils>=0.0.14,<0.1"]
train = ["peft>=0.17,<0.18"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
mami = "mami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
